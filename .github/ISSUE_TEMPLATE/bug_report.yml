name: Bug report / 问题反馈
description: Report a reproducible rendering, input, or documentation problem.
title: "[Bug]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Expected and actual behavior / 预期与实际表现
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction / 最小复现
      description: Include the command and a small synthetic example; omit private data and identifiers.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / 运行环境
      description: OS, R version, package versions, and release or commit.
    validations:
      required: true
